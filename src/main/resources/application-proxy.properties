# Opt-in: solo activar detras de un proxy que sobrescribe X-Forwarded-For.
server.forward-headers-strategy=native
# Vacio = ninguna IP interna confiable en Tomcat 11.0.24; no usar su default amplio.
# Regex de IPs exactas del proxy, por ejemplo: ^10[.]20[.]0[.]10$
server.tomcat.remoteip.internal-proxies=${APP_PROXY_INTERNAL_PROXIES:}
# No habilitar una segunda lista de confianza implicita.
server.tomcat.remoteip.trusted-proxies=
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto
