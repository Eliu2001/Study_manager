spring.application.name=study-manager

# Lee las credenciales del archivo .env de la raiz del proyecto
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=60
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.time-zone=${APP_TIME_ZONE:America/Santiago}

# Ignora cabeceras reenviadas por defecto, incluso en plataformas cloud.
# El perfil proxy habilita Tomcat native con una lista de confianza explicita.
server.forward-headers-strategy=none

# Limite de intentos fallidos de login: por cuenta desde una IP y por IP en total
app.login.max-failures=5
app.login.max-failures-per-ip=20
app.login.window-minutes=15
app.login.lock-minutes=15

# El esquema lo manejara Flyway; Hibernate solo valida que coincida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# No exponer detalles internos en las respuestas de error (DevTools los activa por defecto)
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Solo el estado de salud queda expuesto por HTTP
management.endpoints.web.exposure.include=health
