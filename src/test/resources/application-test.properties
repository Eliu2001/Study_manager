# Las pruebas de integracion usan una base de datos aparte, para no mezclar datos con los tuyos.
# Se crea una sola vez (ver README) y Flyway la migra sola.
spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME}_test

# Margen amplio por IP: todas las pruebas llegan desde 127.0.0.1
app.login.max-failures=5
app.login.max-failures-per-ip=100
