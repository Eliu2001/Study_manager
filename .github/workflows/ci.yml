name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: study_manager_test
          POSTGRES_USER: study_manager_ci
          POSTGRES_PASSWORD: ci-only-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U study_manager_ci -d study_manager_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DB_NAME: study_manager
      DB_USER: study_manager_ci
      DB_PASSWORD: ci-only-postgres-password
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters-long
      TEST_DB_REQUIRED: 'true'
      APP_TIME_ZONE: America/Santiago
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify backend with required PostgreSQL tests
        run: bash ./mvnw --batch-mode --no-transfer-progress verify

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11'
          run_install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
